name: Repair release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to repair
        required: true
        type: string
      source_run_id:
        description: Completed Release run with successful platform builds and Linux publication
        required: true
        type: string

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-publication-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - name: Checkout repair tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          path: source
      - name: Test repair tooling
        run: |
          python3 .github/scripts/test_release_assets.py
          python3 .github/scripts/test_repair_release.py
      - name: Verify original release evidence
        id: evidence
        run: python3 .github/scripts/repair-release.py
      - name: Download original frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}
          name: frontend-dist
          path: source/dist/frontend
      - name: Download original Darwin binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}
          pattern: codex-proxy-rs-darwin-*
          path: source/dist/binaries
      - name: Package original binaries with corrected tooling
        working-directory: source
        env:
          VERSION: ${{ steps.evidence.outputs.version }}
          DOCKER_VERSION: ${{ steps.evidence.outputs.docker_version }}
          IMAGE_NAME: ${{ steps.evidence.outputs.image_name }}
          REGISTRY: ghcr.io
          PLATFORM_MATRIX: ${{ steps.evidence.outputs.matrix }}
        run: python3 ../.github/scripts/package-release.py
      - name: Generate repaired asset provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: source/dist/release/*
      - name: Publish repaired platform assets and merge checksums
        working-directory: source
        run: python3 ../.github/scripts/release-assets.py publish
      - name: Publish complete channel index
        run: python3 .github/scripts/published-channels.py
