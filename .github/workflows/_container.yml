name: Reusable Container

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit SHA to build and validate
        required: true
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CPR_IMAGE: codex-proxy-rs:ci-${{ inputs.ref }}
      TRIVY_QUIET: 'true'
      TRIVY_SKIP_VERSION_CHECK: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Restore compressed Cargo snapshot
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/container-cargo
          key: container-cargo-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/Cargo.lock', 'backend/rust-toolchain.toml', 'backend/**/Cargo.toml', 'backend/.cargo/config.toml', 'deploy/Dockerfile', '.github/actions/cargo-cache/**') }}
          restore-keys: |
            container-cargo-v4-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Cargo mounts to BuildKit
        uses: ./.github/actions/cargo-cache
        with:
          operation: restore
          builder: ${{ steps.buildx.outputs.name }}
          path: ${{ runner.temp }}/container-cargo
          architecture: amd64

      - name: Release restored Cargo snapshot
        run: rm -rf "$RUNNER_TEMP/container-cargo"

      - name: Build runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          load: true
          tags: ${{ env.CPR_IMAGE }}
          no-cache-filters: |
            runtime-base
            runtime
          cache-from: type=gha,scope=runtime-ci
          cache-to: type=gha,mode=max,scope=runtime-ci

      - name: Export compressed Cargo snapshot
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        id: cargo-snapshot
        uses: ./.github/actions/cargo-cache
        with:
          operation: snapshot
          builder: ${{ steps.buildx.outputs.name }}
          path: ${{ runner.temp }}/container-cargo
          architecture: amd64

      - name: Save Cargo snapshot
        if: steps.cargo-snapshot.outputs.usable == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/container-cargo
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Verify runtime image
        uses: ./.github/actions/verify-container
        with:
          private-code-scanning: ${{ vars.ENABLE_PRIVATE_CODE_SCANNING || 'false' }}
          image: ${{ env.CPR_IMAGE }}
          platform: linux/amd64
          artifact-name: container-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-amd64
