version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '09:10'
      timezone: Asia/Shanghai
    # 固定官方 Codex Desktop 的 TLS 指纹；升级前必须抓取握手并比对扩展顺序。
    ignore:
      - dependency-name: aws-lc-rs
      - dependency-name: hyper
      - dependency-name: hyper-rustls
      - dependency-name: hyper-tls
      - dependency-name: hyper-util
      - dependency-name: native-tls
      - dependency-name: openssl
      - dependency-name: openssl-src
      - dependency-name: openssl-sys
      - dependency-name: reqwest
      - dependency-name: rustls
      - dependency-name: rustls-native-certs
      - dependency-name: rustls-pki-types
      - dependency-name: tokio
      - dependency-name: tokio-native-tls
      - dependency-name: tokio-rustls
      - dependency-name: tokio-tungstenite
      - dependency-name: tungstenite
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '09:20'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 1
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: Asia/Shanghai
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
