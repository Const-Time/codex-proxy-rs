[package]
name = "cpr-shared-budget-plugin"
version = "0.3.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
autotests = false

[dependencies]
gateway-plugin-sdk = { path = "../../crates/gateway-plugin/sdk", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.53.3", default-features = false, features = ["io-std", "macros", "rt"] }
uuid = { version = "1.23.3", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.3", default-features = false, features = ["process", "time"] }

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
