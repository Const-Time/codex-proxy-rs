[workspace]
members = [
    "apps/gateway",
    "apps/plugin-cli",
    "apps/shared-budget-plugin",
    "crates/gateway-plugin/sdk",
    "crates/gateway-plugin/runtime",
    "crates/gateway-admin",
    "crates/gateway-api",
    "crates/gateway-core",
    "crates/gateway-host",
    "crates/gateway-protocol",
    "crates/gateway-store",
    "crates/providers/openai",
    "crates/providers/xai",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.97"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
large_enum_variant = { level = "warn", priority = 8 }
needless_collect = { level = "deny", priority = 7 }

[profile.dev]
debug = true

# Native plugin tests repeatedly hash and (de)compress real executable archives.
# Optimize those CPU kernels in dev/test too; keep workspace code, debug symbols,
# overflow checks and assertions unchanged. Release already optimizes all crates.
[profile.dev.package."sha2@0.11.0"]
opt-level = 3

[profile.dev.package."miniz_oxide@0.9.1"]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.release]
debug = false
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"

[patch.crates-io]
# Upstream SOCKS IPv6 fix; remove once a release includes hyperium/hyper-util#302.
hyper-util = { git = "https://github.com/hyperium/hyper-util", rev = "191b1acf0a6b18e807e4abf5a6d4a7c47979ecd6" }
