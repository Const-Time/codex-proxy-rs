[package]
name = "gateway-plugin-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
autotests = false

[dependencies]
url = "2.5.8"
base64 = "0.22.1"
bytes = "1.11.1"
gateway-core = { path = "../../gateway-core" }
gateway-protocol = { path = "../../gateway-protocol" }
async-trait = "0.1.89"
futures = "0.3.32"
flate2 = "1.1.9"
gateway-admin = { path = "../../gateway-admin" }
gateway-host = { path = "../../gateway-host" }
gateway-plugin-sdk = { path = "../sdk", features = ["io"] }
hex = "0.4.3"
http = "1.4.0"
http-body = "1.0.1"
http-body-util = "0.1.3"
image = { version = "0.25.8", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
jsonschema = { version = "0.58.4", default-features = false }
roxmltree = "0.21.1"
semver = "1.0.27"
serde = "1.0.228"
serde_json = "1.0.150"
sha2 = "0.11.0"
tar = "0.4.44"
tempfile = "3.27.0"
thiserror = "2.0.18"
tracing = "0.1.44"
tokio = { version = "1.52.3", default-features = false, features = ["macros", "rt", "sync", "time", "io-util", "io-std"] }
uuid = { version = "1.23.3", features = ["v4"] }

[dev-dependencies]
chrono = "0.4.45"
gateway-store = { path = "../../gateway-store" }
provider-openai = { path = "../../providers/openai" }
secrecy = "0.10.3"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
gateway-api = { path = "../../gateway-api" }
tokio = { version = "1.52.3", default-features = false, features = ["rt-multi-thread", "test-util"] }

[[test]]
name = "main"
path = "tests/main.rs"

[[bin]]
name = "gateway-plugin-test-worker"
path = "tests/worker.rs"
test = false
bench = false
doc = false

[lints]
workspace = true
